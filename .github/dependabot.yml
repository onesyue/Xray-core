# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    ignore:
      # Held strictly below 8cdf7bf9 (20260908062103), which rejects every
      # ClientHello without an X25519MLKEM768 key share and would lock out
      # default-configured clients. See yue-node fork-ledger.yaml,
      # reality-classical-keyshare-hold. Moving it is a deliberate decision,
      # never a bot PR.
      - dependency-name: "github.com/xtls/reality"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
