name: Build and Push Docker Image

on:
  release:
    types:
      - published
      - released

  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag:"
        required: true
      latest:
        description: "Set to latest"
        type: boolean
        default: false

permissions: {}

jobs:
  build-and-push:
    if: (github.event.action != 'published') || (github.event.action == 'published' && github.event.release.prerelease == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set repository and image name to lowercase
        env:
          IMAGE_NAME: "${{ github.repository }}"
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "FULL_IMAGE_NAME=ghcr.io/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Validate and extract tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_LATEST: ${{ github.event.inputs.latest }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          SOURCE_TAG="$INPUT_TAG"
          if [[ -z "$SOURCE_TAG" ]]; then
            SOURCE_TAG="$REF_NAME"
          fi
          if [[ -z "$SOURCE_TAG" ]]; then
            SOURCE_TAG="$RELEASE_TAG"
          fi

          if [[ -z "$SOURCE_TAG" ]]; then
            echo "Error: Could not determine a valid tag source. Input tag and context tag (github.ref_name) are both empty."
            exit 1
          fi

          if [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9] ]]; then
            IMAGE_TAG="${SOURCE_TAG#v}"
          else
            IMAGE_TAG="$SOURCE_TAG"
          fi

          # A workflow_dispatch input is untrusted shell data. Restrict it to
          # the OCI/Docker tag alphabet before writing it to GITHUB_ENV or
          # using it as a command argument. This also rejects newlines and
          # prevents environment-file command injection.
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Error: '$IMAGE_TAG' is not a valid Docker image tag."
            exit 1
          fi

          echo "Docker image tag: '$IMAGE_TAG'."
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          LATEST=false
          if [[ "$EVENT_NAME" == "release" && "$RELEASE_PRERELEASE" == "false" ]] || [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_LATEST" == "true" ]]; then
            LATEST=true
          fi

          echo "Latest: '$LATEST'."
          echo "LATEST=$LATEST" >> "$GITHUB_ENV"

          NEWEST=false
          if [[ "$EVENT_NAME" == "release" ]]; then
            NEWEST=true
          fi

          echo "Newest: '$NEWEST'."
          echo "NEWEST=$NEWEST" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (main architectures)
        id: build_main_arches
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .github/docker/Dockerfile
          platforms: |
            linux/amd64
            linux/arm/v7
            linux/arm64/v8
            linux/ppc64le
            linux/s390x
          provenance: false
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Build Docker image (additional architectures)
        id: build_additional_arches
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .github/docker/Dockerfile.usa
          platforms: |
            linux/386
            linux/arm/v6
            linux/riscv64
            linux/loong64
          provenance: false
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Create manifest list and push
        env:
          ADDITIONAL_DIGEST: ${{ steps.build_additional_arches.outputs.digest }}
          MAIN_DIGEST: ${{ steps.build_main_arches.outputs.digest }}
        run: |
          echo "Creating multi-arch manifest with tag: '$FULL_IMAGE_NAME:$IMAGE_TAG'."
          docker buildx imagetools create \
            --tag "$FULL_IMAGE_NAME:$IMAGE_TAG" \
            "$FULL_IMAGE_NAME@$MAIN_DIGEST" \
            "$FULL_IMAGE_NAME@$ADDITIONAL_DIGEST"

          if [[ "$LATEST" == "true" ]]; then
            echo "Adding 'latest' tag to manifest: '$FULL_IMAGE_NAME:latest'."
            docker buildx imagetools create \
            --tag "$FULL_IMAGE_NAME:latest" \
            "$FULL_IMAGE_NAME:$IMAGE_TAG"
          fi

          if [[ "$NEWEST" == "true" ]]; then
            echo "Adding 'pre-release' tag to manifest: '$FULL_IMAGE_NAME:pre-release'."
            docker buildx imagetools create \
            --tag "$FULL_IMAGE_NAME:pre-release" \
            "$FULL_IMAGE_NAME:$IMAGE_TAG"
          fi

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "$FULL_IMAGE_NAME:$IMAGE_TAG"

          if [[ "$LATEST" == "true" ]]; then
            docker buildx imagetools inspect "$FULL_IMAGE_NAME:latest"
          fi

          if [[ "$NEWEST" == "true" ]]; then
            docker buildx imagetools inspect "$FULL_IMAGE_NAME:pre-release"
          fi
