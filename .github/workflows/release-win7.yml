name: Build and Release for Windows 7

# XTLS/go-win7 published patched-1.26.7 on 2026-08-20. Pin the exact archive
# URL and GitHub-published SHA-256 at the reviewed security floor. Native
# targets use Go 1.26.8 bug fixes; patched-1.26.8 is not published upstream.
env:
  GO_SECURITY_FLOOR: "1.26.7"
  WIN7_PATCHED_GO_VERSION: "1.26.7"
  WIN7_PATCHED_GO_ARCHIVE_URL: "https://github.com/XTLS/go-win7/releases/download/patched-1.26.7/go-for-win7-linux-amd64.zip"
  WIN7_PATCHED_GO_ARCHIVE_SHA256: "3ec8549eab338720c1a891f37c6d2467e7205997554bf649527d083f9973b82d"

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify-win7-toolchain:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.verify.outputs.available }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a reviewed patched compiler at the security floor
        id: verify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "available=false" >> "$GITHUB_OUTPUT"
          module_minor="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          expected_url="https://github.com/XTLS/go-win7/releases/download/patched-${WIN7_PATCHED_GO_VERSION}/go-for-win7-linux-amd64.zip"
          available=true
          [[ "$WIN7_PATCHED_GO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || available=false
          [[ "$WIN7_PATCHED_GO_VERSION" == "${module_minor}."* ]] || available=false
          [[ "$WIN7_PATCHED_GO_VERSION" == "$GO_SECURITY_FLOOR" ]] || available=false
          [[ "$WIN7_PATCHED_GO_ARCHIVE_URL" == "$expected_url" ]] || available=false
          [[ "$WIN7_PATCHED_GO_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || available=false
          if [[ "$available" != true ]]; then
            message="No reviewed XTLS/go-win7 patched-${GO_SECURITY_FLOOR} toolchain is pinned; Win7 artifacts are disabled"
            if [[ "$EVENT_NAME" == "release" ]]; then
              echo "::error::$message"
              exit 1
            fi
            echo "::warning::$message"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

  check-assets:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - name: Restore Geodat Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources
          key: xray-geodat-

      - name: Restore Wintun Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources
          key: xray-wintun-

      - name: Check Assets Existence
        id: check-assets
        run: |
          [ -d 'resources' ] || mkdir resources
          LIST=('geoip.dat' 'geosite.dat')
          for FILE_NAME in "${LIST[@]}"
          do
            echo -e "Checking ${FILE_NAME}..."
            if [ -s "./resources/${FILE_NAME}" ]; then
              echo -e "${FILE_NAME} exists."
            else
              echo -e "${FILE_NAME} does not exist."
              echo "missing=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done
          LIST=('amd64' 'x86')
          for ARCHITECTURE in "${LIST[@]}"
          do
            echo -e "Checking wintun.dll for ${ARCHITECTURE}..."
            if [ -s "./resources/wintun/bin/${ARCHITECTURE}/wintun.dll" ]; then
              echo -e "wintun.dll for ${ARCHITECTURE} exists."
            else
              echo -e "wintun.dll for ${ARCHITECTURE} is missing."
              echo "missing=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      - name: Sleep for 90 seconds if Assets Missing
        if: steps.check-assets.outputs.missing == 'true'
        run: sleep 90

  build:
    needs: [check-assets, verify-win7-toolchain]
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          # BEGIN Windows 7
          - goos: windows
            goarch: amd64
            assetname: win7-64
          - goos: windows
            goarch: 386
            assetname: win7-32
          # END Windows 7
      fail-fast: false

    runs-on: ubuntu-latest
    if: >-
      needs.verify-win7-toolchain.outputs.available == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name)
    env:
      GOOS: ${{ matrix.goos}}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show workflow information
        run: |
          _NAME=${{ matrix.assetname }}
          echo "GOOS: ${{ matrix.goos }}, GOARCH: ${{ matrix.goarch }}, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.8"
          check-latest: false

      - name: Setup patched builder
        run: |
          set -euo pipefail
          GOSDK="$(go env GOROOT)"
          rm -r "${GOSDK:?}"/*
          cd "$GOSDK"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output go-for-win7-linux-amd64.zip \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "$WIN7_PATCHED_GO_ARCHIVE_URL"
          echo "$WIN7_PATCHED_GO_ARCHIVE_SHA256  go-for-win7-linux-amd64.zip" \
            | sha256sum --check --strict
          unzip ./go-for-win7-linux-amd64.zip -d "$GOSDK"
          rm ./go-for-win7-linux-amd64.zip
          test "$(go env GOVERSION)" = "go${WIN7_PATCHED_GO_VERSION}"
          go version

      - name: Get project dependencies
        run: go mod download

      - name: Build Xray
        run: |
          mkdir -p build_assets
          COMMID=$(git describe --always --dirty)
          echo 'Building Xray for Windows 7...'
          go build -o build_assets/xray.exe -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" -v ./main
          go version -m build_assets/xray.exe \
            | awk -v required="go${WIN7_PATCHED_GO_VERSION}" \
              'NR == 1 && $2 == required { found = 1 } END { exit !found }'
          # The line below is for without running conhost.exe version. Commented for not being used. Provided for reference.
          # go build -o build_assets/wxray.exe -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags="-H windowsgui -X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" -v ./main

      - name: Restore Geodat Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources
          key: xray-geodat-

      - name: Restore Wintun Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources
          key: xray-wintun-

      - name: Add additional assets into package
        run: |
          mv -f resources/geo* build_assets/
          if [[ ${GOOS} == 'windows' ]]; then
            cp .github/build/windows/* build_assets/
          fi
          if [[ ${GOOS} == 'windows' ]]; then
            echo 'Adding Wintun into packages'
            if [[ ${GOARCH} == 'amd64' ]]; then
              mv resources/wintun/bin/amd64/wintun.dll build_assets/
            fi
            if [[ ${GOARCH} == '386' ]]; then
              mv resources/wintun/bin/x86/wintun.dll build_assets/
            fi
            mv resources/wintun/LICENSE.txt build_assets/LICENSE-Wintun
          fi

      - name: Copy README.md & LICENSE
        run: |
          cp "${GITHUB_WORKSPACE}/README.md" ./build_assets/README.md
          cp "${GITHUB_WORKSPACE}/LICENSE" ./build_assets/LICENSE

      - name: Create ZIP archive
        if: github.event_name == 'release'
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt "$(date +%Y01010000)" ./*
          zip -9vr ../Xray-${{ env.ASSET_NAME }}.zip .
          popd || exit 1
          FILE=./Xray-${{ env.ASSET_NAME }}.zip
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst "-$METHOD" "$FILE" | sed 's/([^)]*)//g' >>"$DGST"
          done

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        if: github.event_name == 'release'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./Xray-${{ env.ASSET_NAME }}.zip*
          tag: ${{ github.ref }}
          file_glob: true

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Xray-${{ env.ASSET_NAME }}
          path: |
            ./build_assets/*
